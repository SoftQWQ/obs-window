<div id="obs-wrap">
<style>
:root{--bg1:#f0ebe2;--bg2:#ede7dc;--line:#d8d0c2;--gold:#a8843e;--gold2:#8a6d35;--tx:#3d3830;--dim:#8a8175;--nsfw:#b8503e;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;color:var(--tx);line-height:1.6;font-size:14px;background:transparent}
.archive{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2));max-width:820px;margin:12px auto}
.a-head{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;user-select:none;border-bottom:1px solid var(--line)}
.a-head:hover{background:rgba(168,132,62,.05)}
.a-mark{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px rgba(168,132,62,.6);animation:pulse 1.8s infinite;flex:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.a-title{font-weight:600;letter-spacing:1px;color:var(--gold2);flex:none}
.a-sub{color:var(--dim);font-size:.85em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-arrow{color:var(--dim);transition:transform .2s;flex:none}
.archive.open .a-arrow{transform:rotate(180deg)}
.a-panel{display:none;padding:12px 16px 16px}
.archive.open .a-panel{display:block}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px 14px;margin-bottom:12px}
.f{font-size:.85em;display:flex;gap:6px}
.f b{color:var(--gold2);font-weight:600;flex:none}
.f span{color:var(--tx);word-break:break-word}
.f.state span{color:var(--nsfw)}
.sec-title{font-size:.78em;letter-spacing:2px;color:var(--gold);margin:12px 0 6px}
.frames{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.frame{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#0a0b16;aspect-ratio:2/3}
.frame img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .25s}
.frame.nsfw img{filter:blur(22px) brightness(.8)}
.frame.nsfw.shown img{filter:none}
.veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:#fff;font-size:.85em;background:rgba(10,8,25,.25);cursor:pointer;text-align:center;padding:8px}
.frame.shown .veil{display:none}
.miss{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--dim);font-size:.8em}
.danmaku{max-height:320px;overflow-y:auto;padding-right:4px;display:flex;flex-direction:column;gap:4px}
.dm{font-size:.88em;padding:3px 8px;border-radius:6px;background:rgba(168,132,62,.06);border-left:2px solid rgba(168,132,62,.25);word-break:break-word}
.dm:nth-child(3n){background:rgba(168,132,62,.03)}
.desc{font-size:.9em;line-height:1.85;color:var(--tx);background:rgba(168,132,62,.05);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap}
.empty{color:var(--dim);font-size:.85em}
.err{color:var(--nsfw);font-size:.85em;line-height:1.7}
</style>
<div id="obs-root"><div class="err" style="max-width:820px;margin:12px auto;padding:12px 16px">等待数据…</div></div>
<script>
(function(){
  var IMAGE_BASE_URL = 'https://img.emolsp.online/CG/wife_forum/';

  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
  function field(x,n){var m=x.match(new RegExp('\\['+n+'\\|([^\\]]*)\\]'));return m?m[1].trim():'';}
  function block(x,t){var m=x.match(new RegExp('<'+t+'>([\\s\\S]*?)</'+t+'>'));return m?m[1].trim():'';}
  function rows(x,label,n){var mid=[];for(var i=0;i<n-1;i++){mid.push('([^\\|\\]]*)');}var re=new RegExp('\\['+label+'\\|'+mid.join('\\|')+'\\|([^\\]]*)\\]','g');var out=[],m;while((m=re.exec(x))!==null){out.push(m.slice(1).map(function(s){return s.trim();}));}return out;}

  function getRaw(){
    try{
      var gc = (typeof getChatMessages === 'function') ? getChatMessages : (window.parent && window.parent.getChatMessages);
      var gid = (typeof getCurrentMessageId === 'function') ? getCurrentMessageId : (window.parent && window.parent.getCurrentMessageId);
      if(typeof gc !== 'function' || typeof gid !== 'function') return '';
      var msgs = gc(gid());
      if(!msgs || !msgs[0] || !msgs[0].message) return '';
      var m = msgs[0].message.match(/<obs_window>([\s\S]*?)<\/obs_window>/);
      return m ? m[1] : '';
    }catch(e){ return ''; }
  }

  function render(raw){
    var root = document.getElementById('obs-root');
    var id=field(raw,'档案编号'),era=field(raw,'档案年代'),summary=field(raw,'场景概要'),viewers=field(raw,'在线回看'),status=field(raw,'档案状态');
    var frames=rows(block(raw,'images'),'图片',3),dms=rows(block(raw,'danmaku_list'),'弹幕',2),desc=block(raw,'window_description');

    root.innerHTML='<div class="archive"><div class="a-head"><span class="a-mark"></span><span class="a-title">情感档案</span><span class="a-sub">'+esc((id?id+' · ':'')+(era||'')+(status?' · '+status:''))+'</span><span class="a-arrow">▾</span></div><div class="a-panel"></div></div>';
    var archive=root.querySelector('.archive'),head=root.querySelector('.a-head'),panel=root.querySelector('.a-panel');
    head.addEventListener('click',function(){archive.classList.toggle('open');});

    var h='',fs='';
    if(id)fs+='<div class="f"><b>编号</b><span>'+esc(id)+'</span></div>';
    if(era)fs+='<div class="f"><b>年代</b><span>'+esc(era)+'</span></div>';
    if(summary)fs+='<div class="f"><b>场景</b><span>'+esc(summary)+'</span></div>';
    if(viewers)fs+='<div class="f"><b>回看</b><span>'+esc(viewers)+'</span></div>';
    if(status)fs+='<div class="f state"><b>状态</b><span>'+esc(status)+'</span></div>';
    if(fs)h+='<div class="fields">'+fs+'</div>';

    var fh='';
    frames.forEach(function(f){
      if(!f[0])return;
      var nsfw=(f[1]==='true');
      var src=/^https?:/.test(f[0])?f[0]:IMAGE_BASE_URL+f[0];
      fh+='<div class="frame'+(nsfw?' nsfw':'')+'"><img src="'+esc(src)+'" loading="lazy" onerror="this.style.display=\'none\';this.parentNode.querySelector(\'.miss\').style.display=\'flex\'" /><div class="miss">画面不可用</div>'+(nsfw?'<div class="veil"><span>⚠ 成人画面</span><span>点击显示</span></div>':'')+'</div>';
    });
    if(fh)h+='<div class="sec-title">档案截图</div><div class="frames">'+fh+'</div>';
    if(dms.length)h+='<div class="sec-title">弹幕回看</div><div class="danmaku">'+dms.map(function(d){return '<div class="dm">'+esc(d[0])+'</div>';}).join('')+'</div>';
    if(desc)h+='<div class="sec-title">档案记录</div><div class="desc">'+esc(desc)+'</div>';
    panel.innerHTML=h||'<div class="empty">档案内容为空</div>';

    Array.prototype.forEach.call(root.querySelectorAll('.frame.nsfw'),function(f){
      f.addEventListener('click',function(e){e.stopPropagation();f.classList.add('shown');});
    });
  }

  var tries=0;
  function tick(){
    tries++;
    var raw=getRaw();
    if(raw){render(raw);return;}
    if(tries<15){setTimeout(tick,300);}
    else{
      document.getElementById('obs-root').innerHTML='<div class="err" style="max-width:820px;margin:12px auto;padding:12px 16px;border:1px solid #d8d0c2;border-radius:8px;background:rgba(184,80,62,.06)">读不到档案内容。请检查：1. 正则 Find 为 &lt;obs_window&gt;([\\s\\S]*?)&lt;\\/obs_window&gt;；2. 消息原文里确实有 &lt;obs_window&gt;；3. 酒馆助手已启用。</div>';
    }
  }
  tick();
})();
</script>
</div>
