<div id="obs-wrap">
<style>
:root{
  --pink-bg:#fdf2f5;
  --pink-card:#fff8fa;
  --pink-soft:#fbe4ec;
  --pink-line:#f3c9d8;
  --peach:#ff7a9c;
  --peach-deep:#e85a83;
  --rose:#d94f76;
  --text-main:#5a3a45;
  --text-dim:#9c7a86;
  --text-dimmer:#c2a3ae;
  --gold:#d98fa6;
  --border:rgba(232,90,131,.22);
  --hover-bg:rgba(232,90,131,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text-main);line-height:1.6;font-size:14px;background:transparent}
.room{width:100%;max-width:860px;margin:0 auto;background:linear-gradient(160deg,var(--pink-bg),var(--pink-soft));border:1px solid var(--pink-line);border-radius:14px;overflow:hidden;box-shadow:0 6px 20px rgba(232,90,131,.08)}
.btn{background:var(--pink-card);color:var(--rose);border:1px solid var(--pink-line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.9em;font-family:inherit;transition:all .2s}
.btn:hover{background:var(--hover-bg);border-color:var(--peach)}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(135deg,rgba(255,122,156,.22),rgba(255,248,250,0));border-bottom:1px solid var(--pink-line)}
.avatar{flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background:linear-gradient(135deg,var(--peach),var(--rose));box-shadow:0 2px 8px rgba(232,90,131,.25)}
.host{flex:1;min-width:0}
.host-name{font-weight:700;color:var(--rose);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.host-lv{margin-left:6px;font-size:.75em;background:var(--peach);color:#fff;border-radius:6px;padding:1px 7px}
.room-title{font-size:.85em;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:14px;padding:7px 14px;background:var(--pink-card);color:var(--text-dim);font-size:.82em;border-bottom:1px solid var(--pink-line);flex-wrap:wrap}
.live-dot{color:var(--peach);font-weight:700;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.userbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 14px;font-size:.82em;border-bottom:1px solid var(--pink-line)}
.chip{background:var(--pink-card);border:1px solid var(--pink-line);border-radius:999px;padding:2px 12px;color:var(--text-dim)}
.chip b{color:var(--rose)}
.announce{margin:10px 14px 0;padding:9px 12px;background:rgba(255,122,156,.1);border:1px solid rgba(232,90,131,.25);border-radius:10px;font-size:.85em;color:var(--text-dim)}
.announce b{color:var(--rose)}
.stage{position:relative;margin:10px 14px 0;height:130px;border-radius:12px;background:linear-gradient(135deg,#ffe6ee,#ffd3e0);border:1px solid var(--pink-line);overflow:hidden}
.stage-label{position:absolute;left:12px;top:8px;font-size:.72em;color:rgba(217,79,118,.55);z-index:2}
.danmaku{position:absolute;left:100%;white-space:nowrap;color:var(--rose);font-size:.92em;text-shadow:0 1px 2px rgba(255,255,255,.8);animation:fly linear forwards;pointer-events:none}
@keyframes fly{from{transform:translateX(0)}to{transform:translateX(calc(-100vw - 100%))}}
.gallery{display:flex;gap:8px;padding:10px 14px 0;overflow-x:auto}
.gallery .frame{position:relative;flex:none;height:160px;width:120px;border-radius:10px;border:1px solid var(--pink-line);cursor:pointer;background:#fbe4ec;overflow:hidden}
.gallery .frame img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .25s}
.gallery .frame.nsfw img{filter:blur(22px) brightness(.92)}
.gallery .frame.nsfw.shown img{filter:none}
.veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:#fff;font-size:.8em;background:rgba(217,79,118,.28);cursor:pointer;text-align:center;padding:8px}
.frame.shown .veil{display:none}
.miss{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--text-dim);font-size:.8em}
.section-title{padding:12px 14px 4px;font-size:.95em;font-weight:700;color:var(--rose)}
.desc{margin:0 14px;padding:10px 12px;background:var(--pink-card);border:1px solid var(--pink-line);border-radius:10px;font-size:.92em;line-height:1.85;white-space:pre-wrap;color:var(--text-main)}
.chat{margin:0 14px;max-height:340px;overflow-y:auto;border:1px solid var(--pink-line);border-radius:10px;background:var(--pink-card);padding:6px 10px}
.msg{padding:4px 0;font-size:.9em;word-break:break-word}
.msg .name{color:var(--rose);font-weight:600}
.msg .lv{font-size:.7em;background:var(--pink-soft);color:var(--text-dim);border-radius:4px;padding:0 5px;margin:0 4px}
.msg .tag-future{font-size:.7em;background:linear-gradient(135deg,#ff8fab,#d94f76);color:#fff;border-radius:4px;padding:0 5px;margin-right:4px}
.notice{padding:10px 14px 14px;color:var(--text-dimmer);font-size:.78em;border-top:1px solid var(--pink-line);margin-top:12px}
.empty,.err{padding:24px 16px;text-align:center;color:var(--text-dim);font-size:.9em}
@media (max-width:520px){
  .gallery .frame{height:130px;width:98px}
  .chat{max-height:280px}
  .stats{font-size:.78em;gap:10px}
}
</style>
<div class="room" id="room">
  <div class="empty">等待数据…</div>
</div>
<script>
(function(){
  var IMAGE_BASE_URL = 'https://img.emolsp.online/CG/wife_forum/';

  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
  function field(x,n){var m=x.match(new RegExp('\\['+n+'\\|([^\\]]*)\\]'));return m?m[1].trim():'';}
  function block(x,t){var m=x.match(new RegExp('<'+t+'>([\\s\\S]*?)</'+t+'>'));return m?m[1].trim():'';}
  function rows(x,label,n){var mid=[];for(var i=0;i<n-1;i++){mid.push('([^\\|\\]]*)');}var re=new RegExp('\\['+label+'\\|'+mid.join('\\|')+'\\|([^\\]]*)\\]','g');var out=[],m;while((m=re.exec(x))!==null){out.push(m.slice(1).map(function(s){return s.trim();}));}return out;}
  function hashCode(str){var h=0;for(var i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))|0;}return Math.abs(h);}
  function avatarColor(name){var hue=hashCode(name||'?')%360;return 'hsl('+hue+',55%,70%)';}

  function getRaw(){
    try{
      var gc=(typeof getChatMessages==='function')?getChatMessages:(window.parent&&window.parent.getChatMessages);
      var gid=(typeof getCurrentMessageId==='function')?getCurrentMessageId:(window.parent&&window.parent.getCurrentMessageId);
      if(typeof gc!=='function'||typeof gid!=='function')return '';
      var msgs=gc(gid());
      if(!msgs||!msgs[0]||!msgs[0].message)return '';
      var m=msgs[0].message.match(/<obs_window>([\s\S]*?)<\/obs_window>/);
      return m?m[1]:'';
    }catch(e){return '';}
  }

  function render(raw){
    var id=field(raw,'档案编号'),era=field(raw,'档案年代'),summary=field(raw,'场景概要'),viewers=field(raw,'在线回看'),status=field(raw,'档案状态');
    var frames=rows(block(raw,'images'),'图片',3);
    var dms=rows(block(raw,'danmaku_list'),'弹幕',2);
    var desc=block(raw,'window_description');

    var room=document.getElementById('room');

    var gallery='';
    frames.forEach(function(f){
      if(!f[0])return;
      var nsfw=(f[1]==='true');
      var src=/^https?:/.test(f[0])?f[0]:IMAGE_BASE_URL+f[0];
      gallery+='<div class="frame'+(nsfw?' nsfw':'')+'"><img src="'+esc(src)+'" loading="lazy" onerror="this.style.display=\'none\';this.parentNode.querySelector(\'.miss\').style.display=\'flex\'" /><div class="miss">画面不可用</div>'+(nsfw?'<div class="veil"><span>⚠ 成人画面</span><span>点击显示</span></div>':'')+'</div>';
    });

    var chat='';
    dms.forEach(function(d){
      var text=d[0]||'';
      var isFuture=/未来|我们这儿|档案|几十年|穿越|这个时代/.test(text);
      var uname='观众'+String(1000+Math.floor(Math.random()*9000));
      chat+='<div class="msg">'+(isFuture?'<span class="tag-future">未来</span>':'')
          +'<span class="name">'+esc(uname)+'</span>'
          +'<span class="lv">Lv.'+String(10+Math.floor(Math.random()*60))+'</span>'
          +'<span>：'+esc(text)+'</span></div>';
    });

    room.innerHTML=
      '<div class="top">'
      +'<div class="avatar">档</div>'
      +'<div class="host"><div class="host-name">情感档案回看<span class="host-lv">'+esc(status||'回看模式')+'</span></div><div class="room-title">'+esc(summary||'未命名场景')+'</div></div>'
      +'</div>'
      +'<div class="stats"><span class="live-dot">● 回看中</span><span>👁 '+esc(viewers||'0')+'</span><span>🆔 '+esc(id||'—')+'</span><span>⏳ '+esc(era||'—')+'</span></div>'
      +'<div class="userbar"><span class="chip">档案编号 <b>'+esc(id||'—')+'</b></span><span class="chip">年代 <b>'+esc(era||'—')+'</b></span><span class="chip">状态 <b>'+esc(status||'回看模式')+'</b></span></div>'
      +'<div class="announce"><b>📢 档案说明</b> 本档案为未来观测者回看过去情感切片，单向记录，无法互动，不改变过去任何事件。</div>'
      +'<div class="stage"><div class="stage-label">弹幕</div></div>'
      +(gallery?'<div class="gallery">'+gallery+'</div>':'')
      +'<div class="section-title">🎬 场景记录</div>'
      +'<div class="desc">'+esc(desc||'—')+'</div>'
      +'<div class="section-title">💬 弹幕回看</div>'
      +'<div class="chat">'+(chat||'<div class="empty">暂无弹幕</div>')+'</div>'
      +'<div class="notice">所有出镜人物均为成年人。本档案为单向观测记录，弹幕传不回过去，画面中人物无法感知，不产生任何现实后果。</div>';

    Array.prototype.forEach.call(room.querySelectorAll('.frame.nsfw'),function(f){
      f.addEventListener('click',function(e){e.stopPropagation();f.classList.add('shown');});
    });

    var stage=room.querySelector('.stage');
    var texts=dms.map(function(d){return d[0];}).filter(Boolean);
    if(stage&&texts.length){
      var i=0;
      setInterval(function(){
        if(stage.querySelectorAll('.danmaku').length>6)return;
        var el=document.createElement('div');
        el.className='danmaku';
        el.textContent=texts[i%texts.length];i++;
        el.style.top=(22+Math.floor(Math.random()*4)*26)+'px';
        el.style.animationDuration=(9+Math.random()*6)+'s';
        el.addEventListener('animationend',function(){el.remove();});
        stage.appendChild(el);
      },1200);
    }
  }

  var tries=0;
  function tick(){
    tries++;
    var raw=getRaw();
    if(raw){render(raw);return;}
    if(tries<15){setTimeout(tick,300);}
    else{
      document.getElementById('room').innerHTML='<div class="err">读不到档案内容。请检查：1. 正则 Find 为 &lt;obs_window&gt;([\\s\\S]*?)&lt;\\/obs_window&gt;；2. 消息原文里确实有 &lt;obs_window&gt;；3. 酒馆助手已启用。</div>';
    }
  }
  tick();
})();
</script>
</div>
