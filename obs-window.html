<div id="live-app">
<style>
@import url('https://fontsapi.zeoseven.com/292/main/result.css');
#live-app { 
  --gold: #a8843e; --gold2: #8a6d35; --bg1: #f0ebe2; --bg2: #ede7dc; --line: #d8d0c2; 
  --tx: #3d3830; --dim: #8a8175; --nsfw: #b8503e;
  font-family: "Noto Sans SC", sans-serif; max-width: 800px; margin: 12px auto; 
  background: var(--bg1); border-radius: 12px; overflow: hidden; 
  box-shadow: 0 4px 15px rgba(0,0,0,.05); color: var(--tx); font-size: 14px; line-height: 1.6; 
  border: 1px solid var(--line);
}
#live-app * { box-sizing: border-box; margin: 0; padding: 0; }

/* 顶部导航 */
.live-header { background: linear-gradient(90deg, var(--gold2), var(--gold)); color: #fff; padding: 12px 16px; display: flex; align-items: center; cursor: pointer; user-select: none; }
.live-header .dot { width: 8px; height: 8px; background: #fff; border-radius: 50%; margin-right: 10px; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }
.live-header .title { flex: 1; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 1px; }
.live-header .stats { font-size: 13px; margin-right: 15px; opacity: 0.9; }
.live-header .toggle { font-size: 13px; opacity: 0.8; }
.live-body { display: block; }
.live-body.collapsed { display: none; }

/* 档案信息条 */
.live-info-bar { background: var(--bg2); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; color: var(--gold2); }
.live-info-bar .back-btn { background: rgba(168,132,62,0.1); padding: 4px 10px; border-radius: 6px; font-size: 13px; border: 1px solid rgba(168,132,62,0.2); }
.live-info-bar .info-title { font-weight: 600; font-size: 15px; letter-spacing: 2px; }
.live-info-bar .actions { display: flex; gap: 8px; }
.live-info-bar .actions span { background: rgba(168,132,62,0.1); padding: 4px 10px; border-radius: 6px; font-size: 13px; border: 1px solid rgba(168,132,62,0.2); }

.main-card { padding: 16px; }
.host-profile { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.avatar-box { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--gold); overflow: hidden; background: #fff; }
.avatar-box svg { width: 100%; height: 100%; }
.host-info .name { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 6px; color: var(--gold2); }
.host-info .lv { background: rgba(168,132,62,0.15); color: var(--gold2); font-size: 12px; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
.host-info .title { color: var(--dim); font-size: 14px; margin-top: 4px; }

.status-badge { display: inline-block; border: 1px solid var(--line); color: var(--gold2); padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; margin-bottom: 16px; background: #fff; }

.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.stat-card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
.stat-label { color: var(--dim); font-size: 12px; margin-bottom: 4px; }
.stat-value { font-size: 20px; font-weight: 700; color: var(--gold2); }

/* 媒体区与弹幕 */
.media-area { position: relative; background: #111; border-radius: 8px; overflow: hidden; aspect-ratio: 4/3; margin-bottom: 16px; display: flex; justify-content: center; border: 1px solid var(--line); }
.media-area img { width: 100%; height: 100%; object-fit: contain; display: block; opacity: 0; transition: opacity 0.3s; position: absolute; top: 0; left: 0; }
.media-area img.active { opacity: 1; }
.media-area img.nsfw { filter: blur(25px); cursor: pointer; transition: filter 0.3s; }
.media-area img.nsfw.shown { filter: none; }
.danmaku-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
.danmaku-item { position: absolute; left: 100%; white-space: nowrap; color: #fff; font-weight: 600; text-shadow: 1px 1px 3px #000; font-size: 15px; animation: fly linear forwards; }
@keyframes fly { from { transform: translateX(0); } to { transform: translateX(calc(-100vw - 100%)); } }

.nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(168,132,62,0.6); color: #fff; border: none; font-size: 24px; padding: 4px 10px; cursor: pointer; border-radius: 4px; z-index: 10; }
.nav-btn.prev { left: 8px; } .nav-btn.next { right: 8px; }
.dots { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 10; }
.dots span { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.4); cursor: pointer; }
.dots span.active { background: var(--gold); }

.desc-box { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
.desc-title { color: var(--gold2); font-weight: 600; font-size: 14px; margin-bottom: 8px; }
.desc-content { font-size: 14px; line-height: 1.8; color: var(--tx); }

/* 聊天室统一灰色标签 */
.chat-box { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; }
.chat-title { color: var(--gold2); font-weight: 600; font-size: 14px; margin-bottom: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.chat-list { display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; padding-right: 4px; }
.msg { display: flex; gap: 8px; font-size: 14px; align-items: flex-start; padding: 4px 0; }
.msg .badges { display: flex; gap: 4px; flex-shrink: 0; margin-top: 2px; }
.msg .badge { font-size: 11px; padding: 1px 6px; border-radius: 4px; color: #fff; font-weight: 600; height: fit-content; }
.badge.user { background: #888; } 
.badge.vip-0 { display: none; } 
.badge.vip-1 { background: #6a9c89; } /* 浅尝 - 淡淡的青绿 */
.badge.vip-2 { background: #8a6d35; } /* 常客 - 蜜金色 */
.badge.vip-3 { background: #b8503e; } /* 知音 - 禁忌深红 */
.msg .name { font-weight: 600; color: var(--dim); flex-shrink: 0; }
.msg-text { word-break: break-word; color: var(--tx); }
</style>

<!-- 顶部栏 -->
<div class="live-header" onclick="document.querySelector('.live-body').classList.toggle('collapsed'); this.querySelector('.toggle').innerText = document.querySelector('.live-body').classList.contains('collapsed') ? '展开 ▾' : '收起 ▴'">
  <div class="dot"></div>
  <div class="title">档案回看 · <span id="hd-title">加载中...</span></div>
  <div class="stats">👁 <span id="hd-viewers">0</span></div>
  <div class="toggle">收起 ▴</div>
</div>

<div class="live-body">
  <div class="live-info-bar">
    <div class="back-btn">← 返回</div>
    <div class="info-title">情感档案 · 观测端</div>
    <div class="actions"><span>A</span><span>🌙</span></div>
  </div>
  
  <div class="main-card">
    <div class="host-profile">
      <div class="avatar-box">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#a8843e"/><text x="50" y="60" font-size="40" text-anchor="middle" fill="#fff">档</text></svg>
      </div>
      <div class="host-info">
        <div class="name"><span id="host-name">档案编号</span> <span class="lv" id="host-lv">Lv.?</span></div>
        <div class="title" id="host-title">场景概要</div>
      </div>
    </div>
    
    <div class="status-badge" id="status-badge">回看模式</div>
    
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">在线回看</div><div class="stat-value" id="stat-viewers">0</div></div>
      <div class="stat-card"><div class="stat-label">点赞数</div><div class="stat-value" id="stat-likes">0</div></div>
    </div>
    
    <div class="media-area" id="media-area">
      <div class="danmaku-layer" id="danmaku-layer"></div>
      <button class="nav-btn prev" onclick="prevImg()">‹</button>
      <button class="nav-btn next" onclick="nextImg()">›</button>
      <div class="dots" id="img-dots"></div>
    </div>
    
    <div class="desc-box">
      <div class="desc-title">📝 档案实况</div>
      <div class="desc-content" id="desc-content">加载中...</div>
    </div>
    
    <div class="chat-box">
      <div class="chat-title">💬 实时聊天</div>
      <div class="chat-list" id="chat-list"></div>
    </div>
  </div>
</div>
</div>

<script>
(function(){
  var IMAGE_BASE = 'https://img.emolsp.online/CG/wife_forum/';
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function getRaw(){
    try {
      var gc = window.getChatMessages || (window.parent && window.parent.getChatMessages);
      var gid = window.getCurrentMessageId || (window.parent && window.parent.getCurrentMessageId);
      if(typeof gc !== 'function' || typeof gid !== 'function') return '';
      var m = gc(gid())[0].message.match(/<obs_window>([\s\S]*?)<\/obs_window>/);
      return m ? m[1] : '';
    } catch(e){ return ''; }
  }
  
  var imgs = [], currImg = 0, dmTimer = null;
  
  window.prevImg = function(){ if(imgs.length<2)return; currImg = (currImg-1+imgs.length)%imgs.length; updateImg(); };
  window.nextImg = function(){ if(imgs.length<2)return; currImg = (currImg+1)%imgs.length; updateImg(); };
  function updateImg(){
    var els = document.querySelectorAll('.media-area img');
    var dots = document.querySelectorAll('.dots span');
    for(var i=0;i<els.length;i++){ els[i].className = (i===currImg?'active':'') + (els[i].dataset.nsfw==='true'?' nsfw':''); }
    for(var j=0;j<dots.length;j++){ dots[j].className = (j===currImg?'active':''); }
  }

  function render(raw){
    var id = (raw.match(/\[档案编号\|([^\]]+)\]/)||[])[1]||'未知';
    var era = (raw.match(/\[档案年代\|([^\]]+)\]/)||[])[1]||'';
    var summary = (raw.match(/\[场景概要\|([^\]]+)\]/)||[])[1]||'无题';
    var viewers = (raw.match(/\[在线回看\|([^\]]+)\]/)||[])[1]||'0';
    var likes = (raw.match(/\[点赞数\|([^\]]+)\]/)||[])[1]||'0';
    var status = (raw.match(/\[档案状态\|([^\]]+)\]/)||[])[1]||'回看模式';
    var desc = (raw.match(/<window_description>([\s\S]*?)<\/window_description>/)||[])[1]||'';
    
    document.getElementById('hd-title').innerText = summary;
    document.getElementById('hd-viewers').innerText = viewers;
    document.getElementById('host-name').innerText = id;
    document.getElementById('host-title').innerText = summary;
    document.getElementById('host-lv').innerText = era.replace('过去·','');
    document.getElementById('status-badge').innerText = status;
    document.getElementById('stat-viewers').innerText = viewers;
    document.getElementById('stat-likes').innerText = likes;
    document.getElementById('desc-content').innerText = desc.trim();

    // 解析图片
    var imgBlock = (raw.match(/<images>([\s\S]*?)<\/images>/)||[])[1]||'';
    var imgReg = /\[图片\|([^|]+)\|([^\]]+)\]/g, m;
    var area = document.getElementById('media-area');
    var dots = document.getElementById('img-dots');
    area.querySelectorAll('img').forEach(e=>e.remove());
    dots.innerHTML='';
    imgs = [];
    while((m=imgReg.exec(imgBlock))!==null){
      var src = /^https?:/.test(m[1]) ? m[1] : IMAGE_BASE + m[1];
      var nsfw = m[2].trim()==='true';
      var img = document.createElement('img');
      img.src = src;
      img.dataset.nsfw = nsfw;
      if(nsfw) img.onclick = function(){ this.classList.add('shown'); };
      area.appendChild(img);
      imgs.push(img);
      
      var dot = document.createElement('span');
      dot.onclick = (function(idx){ return function(){ currImg = idx; updateImg(); }; })(imgs.length-1);
      dots.appendChild(dot);
    }
    if(imgs.length > 0) updateImg();
    if(imgs.length < 2) area.querySelectorAll('.nav-btn').forEach(e=>e.style.display='none');

    // 解析飘屏弹幕
    var dmBlock = (raw.match(/<danmaku_list>([\s\S]*?)<\/danmaku_list>/)||[])[1]||'';
    var dms = [];
    var dmReg = /\[弹幕\|([^\]]+)\]/g;
    while((m=dmReg.exec(dmBlock))!==null){ dms.push(m[1]); }
    
    if(dmTimer) clearInterval(dmTimer);
    var layer = document.getElementById('danmaku-layer');
    layer.innerHTML = '';
    if(dms.length){
      var dIdx = 0;
      dmTimer = setInterval(function(){
        if(!document.getElementById('live-app')) { clearInterval(dmTimer); return; }
        if(layer.offsetParent === null) return; // 折叠时不渲染
        var text = dms[dIdx % dms.length];
        var el = document.createElement('div');
        el.className = 'danmaku-item';
        el.innerText = text;
        el.style.top = (5 + Math.random() * 60) + '%';
        el.style.animationDuration = (6 + Math.random() * 4) + 's';
        el.onanimationend = function(){ this.remove(); };
        layer.appendChild(el);
        dIdx++;
      }, 1200);
    }

    // 解析聊天室 (更新后的格式)
    var chatBlock = (raw.match(/<chat_messages>([\s\S]*?)<\/chat_messages>/)||[])[1]||'';
    // [消息|昵称|等级|VIP状态|聊天具体内容]
    var chatReg = /\[消息\|([^|]+)\|([^|]+)\|([^|]+)\|([^\]]+)\]/g;
    var chatHtml = '';
    while((m=chatReg.exec(chatBlock))!==null){
      var name = esc(m[1].trim()), lv = esc(m[2].trim()), vip = m[3].trim(), txt = esc(m[4].trim());
      
      var vipClass = vip==='浅尝'?'vip-1':vip==='常客'?'vip-2':vip==='知音'?'vip-3':'vip-0';
      
      chatHtml += '<div class="msg">'
        + '<div class="badges">'
        + '<span class="badge user">用户 '+lv+'</span>'
        + (vip!=='无' ? '<span class="badge '+vipClass+'">'+vip+'</span>' : '')
        + '</div>'
        + '<div><span class="name">'+name+':</span> <span class="msg-text">'+txt+'</span></div>'
        + '</div>';
    }
    var list = document.getElementById('chat-list');
    list.innerHTML = chatHtml || '<div style="color:#999;text-align:center;padding:20px;">暂无聊天记录</div>';
    list.scrollTop = list.scrollHeight;
  }

  var tries = 0;
  function tick(){
    tries++;
    var raw = getRaw();
    if(raw){ render(raw); return; }
    if(tries < 15){ setTimeout(tick, 300); }
    else { document.getElementById('desc-content').innerText = '读取失败，请确认聊天记录中包含 <obs_window>。'; }
  }
  tick();
})();
</script>
